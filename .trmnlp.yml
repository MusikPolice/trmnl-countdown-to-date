# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml) — safe to commit,
# this is just fixture data for local preview, not the real plugin config.
#
# Four dates, deliberately mixed relative to the fixed "today" below
# (2026-06-15) so both eligibility filtering and rotation are exercised:
#   - Birthday Soon (06-20): 5 days away  -> eligible
#   - Canada Day    (07-01): 16 days away -> eligible
#   - Halloween     (10-31): ~138 days    -> excluded by the 100-day window
#   - Christmas     (12-25): ~193 days    -> excluded by the 100-day window
# All four reuse the same placeholder image to keep this file readable —
# swap in real images via bin/build-dates-field.ps1, not by hand here.
custom_fields:
  dates: |
    [
      {"title": "Birthday Soon", "month_day": "06-20", "image_base64": ""},
      {"title": "Canada Day", "month_day": "07-01", "image_base64": ""},
      {"title": "Halloween", "month_day": "10-31", "image_base64": "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="},
      {"title": "Christmas", "month_day": "12-25", "image_base64": "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="}
    ]
  days_ahead_window: 100

variables:
  trmnl:
    system:
      # Unix timestamp for today's date used by the dev server.
      # Update this when testing on a different day: Jun 15 2026 12:00 UTC = 1781524800
      timestamp_utc: 1781524800
    user:
      utc_offset: -14400
