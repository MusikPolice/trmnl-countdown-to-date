---
# Copy this file to settings.yml and fill in your plugin ID.
# settings.yml is gitignored — it contains your plugin ID and will be
# overwritten by `trmnlp push`/`trmnlp pull` with the full server response.
id: YOUR_PLUGIN_ID
strategy: static
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: '{}'
polling_verb: get
framework_version: 3.3
polling_url: ''
polling_headers: ''
polling_body: ''
custom_fields:
- keyname: dates
  field_type: code
  name: Dates
  rows: 16
  description: >-
    JSON array of dates to rotate through, each with "title", "month_day"
    (MM-DD, zero-padded, no year - these recur annually), and "image_base64"
    (a greyscale image, base64-encoded, no data: URI prefix). Generate this
    with bin/build-dates-field.ps1 in the plugin's repo rather than
    hand-editing.
- keyname: days_ahead_window
  field_type: number
  name: Eligibility Window (days)
  optional: true
  default: '100'
  min: '1'
  description: Only rotate through dates that are within this many days away. Leave blank for 100.
name: Countdown to Date
description:
refresh_interval: 15
