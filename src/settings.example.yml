---
# Copy this file to settings.yml and fill in your plugin ID.
# settings.yml is gitignored — it contains your plugin ID and will be
# overwritten by `trmnlp push`/`trmnlp pull` with the full server response.
id: YOUR_PLUGIN_ID
strategy: static
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: '{}'
polling_verb: get
framework_version: 2.3.7
polling_url: ''
polling_headers: ''
polling_body: ''
custom_fields:
- keyname: title
  field_type: string
  name: Title
  description: The name of the date that you're counting down to
- keyname: target_date
  field_type: date
  name: Target Date
  default: '2025-12-25'
  description: The date that you're counting down to
- keyname: image_base64
  field_type: text
  name: Base64 Encoded Image
  description: The image to show above the number of days remaining until the date that you're counting down to
name: Countdown to Date
description:
refresh_interval: 1440
